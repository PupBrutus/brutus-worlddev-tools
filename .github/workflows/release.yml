name: Build Release

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      packagePath: .
    steps:

      # Checkout Local Repository
      - name: Checkout
        uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      # Increment the Package version based on the package.json file
      - name: Bump Version
        id: version
        run: |
          currentVersion=$(jq -r '.version' "${{ env.packagePath }}/package.json")
          IFS='.' read -r major minor patch <<< "${currentVersion}"
          nextVersion="${major}.${minor}.$((patch + 1))"

          jq --arg version "${nextVersion}" \
            '.version = $version' \
            "${{ env.packagePath }}/package.json" > "${{ env.packagePath }}/package.json.tmp"
          mv "${{ env.packagePath }}/package.json.tmp" "${{ env.packagePath }}/package.json"

          echo "previous=${currentVersion}" >> "$GITHUB_OUTPUT"
          echo "value=${nextVersion}" >> "$GITHUB_OUTPUT"
    
      # Configure the Environment Variables needed for releasing the Package
      - name: Set Environment Variables
        run: |
          packageName=$(jq -r '.name' "${{ env.packagePath }}/package.json")
          echo "packageName=${packageName}" >> $GITHUB_ENV
          echo "zipFile=${packageName}-${{ steps.version.outputs.value }}.zip" >> $GITHUB_ENV
          echo "unityPackage=${packageName}-${{ steps.version.outputs.value }}.unitypackage" >> $GITHUB_ENV
          echo "version=${{ steps.version.outputs.value }}" >> $GITHUB_ENV

      - name: Check Existing Tag
        id: tag_check
        run: |
          releaseTag="${{ env.version }}"
          prefixedTag="v${{ env.version }}"
          tagRefs=$(git ls-remote --tags origin "${releaseTag}" "${prefixedTag}" | awk '{print $2}')

          if printf '%s\n' "${tagRefs}" | grep -Fx "refs/tags/${releaseTag}" > /dev/null || \
             printf '%s\n' "${tagRefs}" | grep -Fx "refs/tags/${releaseTag}^{}" > /dev/null; then
            tagName="${releaseTag}"
            tagExists=true
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "${tagRefs}" | grep -Fx "refs/tags/${prefixedTag}" > /dev/null || \
               printf '%s\n' "${tagRefs}" | grep -Fx "refs/tags/${prefixedTag}^{}" > /dev/null; then
            tagName="${prefixedTag}"
            tagExists=true
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            tagName="${releaseTag}"
            tagExists=false
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

          echo "tag_name=${tagName}" >> "$GITHUB_OUTPUT"

          if [ "${tagExists}" = "true" ]; then
            echo "Release tag ${tagName} already exists; skipping package publishing."
          fi

      # Update source.json to reference the new release
      - name: Update source.json
        if: steps.tag_check.outputs.exists != 'true'
        run: |
          repo="${{ github.repository }}"
          releaseUrl="https://github.com/${repo}/releases/download/${{ steps.tag_check.outputs.tag_name }}/${{ env.zipFile }}"
          jq --arg name "${{ env.packageName }}" --arg url "${releaseUrl}" \
            '.packages = (
              (.packages // [])
              | if any(.[]?; .name == $name) then
                  map(if .name == $name then . + {releases: [$url]} else . end)
                else
                  . + [{name: $name, releases: [$url]}]
                end
            )' \
            source.json > source.json.tmp
          mv source.json.tmp source.json

      # Commit the new version metadata
      - name: Commit Release Metadata
        if: steps.tag_check.outputs.exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ env.packagePath }}/package.json" source.json
          if git diff --cached --quiet; then
            echo "No metadata changes to commit."
            exit 0
          fi
          git commit -m "chore: release ${{ steps.version.outputs.value }} [skip ci]"
          git tag -a "${{ steps.tag_check.outputs.tag_name }}" -m "Release ${{ steps.version.outputs.value }}"
          git push origin HEAD:main "${{ steps.tag_check.outputs.tag_name }}"

      # Zip the Package for release
      - name: Create Package Zip
        if: steps.tag_check.outputs.exists != 'true'
        run: |
          zip -r "${{ github.workspace }}/${{ env.zipFile }}" Editor README.md "${{ env.packagePath }}/package.json" LICENSE
      
      # Build a list of files for the UnityPackage
      - name: Track Package Files
        if: steps.tag_check.outputs.exists != 'true'
        run: |
          find "${{ env.packagePath }}/Editor" -name \*.meta > metaList
          if [ -f "README.md.meta" ]; then echo "README.md.meta" >> metaList; fi
      
      # Make a UnityPackage version of the Package for release
      - name: Create UnityPackage
        if: steps.tag_check.outputs.exists != 'true'
        uses: pCYSl5EDgo/create-unitypackage@v1.2.3
        with:
          package-path: ${{ env.unityPackage }}
          include-files: metaList
      
      # Publish the Release to GitHub
      - name: Make Release
        if: steps.tag_check.outputs.exists != 'true'
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844
        with:
          files: |
            ${{ env.zipFile }}
            ${{ env.unityPackage }}
            ${{ env.packagePath }}/package.json
          tag_name: ${{ steps.tag_check.outputs.tag_name }}
