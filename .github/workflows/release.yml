name: Build Release

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      packagePath: .
    steps:

      # Checkout Local Repository
      - name: Checkout
        uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Sync Main Branch
        run: |
          git fetch origin main
          git reset --hard origin/main

      # Increment the Package version based on the package.json file
      - name: Bump Version
        id: version
        run: |
          currentVersion=$(jq -r '.version' "${{ env.packagePath }}/package.json")
          cd "${{ env.packagePath }}"
          nextVersion=$(npm version patch --no-git-tag-version | sed 's/^v//')

          echo "previous=${currentVersion}" >> "$GITHUB_OUTPUT"
          echo "value=${nextVersion}" >> "$GITHUB_OUTPUT"
    
      # Configure the release metadata needed for publishing the package
      - name: Set Release Metadata
        id: release_meta
        run: |
          packageName=$(jq -r '.name' "${{ env.packagePath }}/package.json")
          echo "package_name=${packageName}" >> "$GITHUB_OUTPUT"
          echo "zip_file=${packageName}-${{ steps.version.outputs.value }}.zip" >> "$GITHUB_OUTPUT"
          echo "unity_package=${packageName}-${{ steps.version.outputs.value }}.unitypackage" >> "$GITHUB_OUTPUT"
          echo "version=${{ steps.version.outputs.value }}" >> "$GITHUB_OUTPUT"

      - name: Check Existing Tag
        id: tag_check
        run: |
          releaseTag="${{ steps.release_meta.outputs.version }}"
          prefixedTag="v${{ steps.release_meta.outputs.version }}"
          tagName="${releaseTag}"
          tagExists=false
          tagRefs=$(git ls-remote --tags origin "${releaseTag}" "${prefixedTag}" | awk '{print $2}')

          if printf '%s\n' "${tagRefs}" | grep -Eq "^refs/tags/${releaseTag}(\\^\\{\\})?$"; then
            tagExists=true
            tagName="${releaseTag}"
          elif printf '%s\n' "${tagRefs}" | grep -Eq "^refs/tags/${prefixedTag}(\\^\\{\\})?$"; then
            tagExists=true
            tagName="${prefixedTag}"
          fi

          if [ "${tagExists}" = "true" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

          echo "tag_name=${tagName}" >> "$GITHUB_OUTPUT"

          if [ "${tagExists}" = "true" ]; then
            echo "Release tag ${tagName} already exists; skipping package publishing."
          fi

      # Update source.json to reference the new release
      - name: Update source.json
        if: steps.tag_check.outputs.exists != 'true'
        run: |
          repo="${{ github.repository }}"
          releaseUrl="https://github.com/${repo}/releases/download/${{ steps.tag_check.outputs.tag_name }}/${{ steps.release_meta.outputs.zip_file }}"
          jq --arg name "${{ steps.release_meta.outputs.package_name }}" --arg url "${releaseUrl}" \
            '.packages = (
              (.packages // [])
              | if any(.[]?; .name == $name) then
                  map(
                    if .name == $name then
                      . + {releases: ([$url] + ((.releases // []) | map(select(. != $url))))}
                    else
                      .
                    end
                  )
                else
                  . + [{name: $name, releases: [$url]}]
                end
            )' \
            source.json > source.json.tmp
          mv source.json.tmp source.json

      # Commit the new version metadata
      - name: Commit Release Metadata
        id: release_commit
        if: steps.tag_check.outputs.exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ env.packagePath }}/package.json" source.json
          if git diff --cached --quiet; then
            echo "No metadata changes to commit."
            echo "publish_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: release ${{ steps.version.outputs.value }} [skip ci]"
          if git ls-remote --tags origin "${{ steps.version.outputs.value }}" "v${{ steps.version.outputs.value }}" | awk '{print $2}' | grep -Eq "^refs/tags/(${{ steps.version.outputs.value }}|v${{ steps.version.outputs.value }})(\\^\\{\\})?$"; then
            echo "Remote release tag for ${{ steps.version.outputs.value }} already exists; skipping publish."
            echo "publish_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push origin HEAD:main
          if git ls-remote --tags origin "${{ steps.version.outputs.value }}" "v${{ steps.version.outputs.value }}" | awk '{print $2}' | grep -Eq "^refs/tags/(${{ steps.version.outputs.value }}|v${{ steps.version.outputs.value }})(\\^\\{\\})?$"; then
            echo "Remote release tag for ${{ steps.version.outputs.value }} already exists after branch push; skipping publish."
            echo "publish_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git tag -d "${{ steps.tag_check.outputs.tag_name }}" >/dev/null 2>&1 || true
          git tag -a "${{ steps.tag_check.outputs.tag_name }}" -m "Release ${{ steps.version.outputs.value }}"
          if ! git push origin "${{ steps.tag_check.outputs.tag_name }}"; then
            if git ls-remote --tags origin "${{ steps.version.outputs.value }}" "v${{ steps.version.outputs.value }}" | awk '{print $2}' | grep -Eq "^refs/tags/(${{ steps.version.outputs.value }}|v${{ steps.version.outputs.value }})(\\^\\{\\})?$"; then
              echo "Remote release tag for ${{ steps.version.outputs.value }} already exists after branch push; skipping publish."
              echo "publish_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            exit 1
          fi
          echo "publish_release=true" >> "$GITHUB_OUTPUT"

      # Zip the Package for release
      - name: Create Package Zip
        if: steps.tag_check.outputs.exists != 'true' && steps.release_commit.outputs.publish_release != 'false'
        run: |
          cd "${{ env.packagePath }}"
          zip -r "${{ github.workspace }}/${{ steps.release_meta.outputs.zip_file }}" Editor README.md package.json LICENSE
      
      # Build a list of files for the UnityPackage
      - name: Track Package Files
        if: steps.tag_check.outputs.exists != 'true' && steps.release_commit.outputs.publish_release != 'false'
        run: |
          find "${{ env.packagePath }}/Editor" -name \*.meta > metaList
          if [ -f "${{ env.packagePath }}/README.md.meta" ]; then echo "${{ env.packagePath }}/README.md.meta" >> metaList; fi
      
      # Make a UnityPackage version of the Package for release
      - name: Create UnityPackage
        if: steps.tag_check.outputs.exists != 'true' && steps.release_commit.outputs.publish_release != 'false'
        uses: pCYSl5EDgo/create-unitypackage@v1.2.3
        with:
          package-path: ${{ steps.release_meta.outputs.unity_package }}
          include-files: metaList
      
      # Publish the Release to GitHub
      - name: Make Release
        if: steps.tag_check.outputs.exists != 'true' && steps.release_commit.outputs.publish_release != 'false'
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844
        with:
          files: |
            ${{ steps.release_meta.outputs.zip_file }}
            ${{ steps.release_meta.outputs.unity_package }}
            ${{ env.packagePath }}/package.json
          tag_name: ${{ steps.tag_check.outputs.tag_name }}
